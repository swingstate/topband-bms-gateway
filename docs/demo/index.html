<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopBand BMS Gateway — Demo</title>
  <meta name="csrf-token" content="demo-csrf-token">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./uplot.min.css">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    /* Demo badge — minimal, unobtrusive */
    .demo-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(232, 156, 92, 0.18);
      color: var(--color-warning, #E89C5C);
      border: 1px solid rgba(232, 156, 92, 0.40);
      border-radius: 3px;
      margin-right: 2px;
      cursor: default;
      user-select: none;
    }
    /* Toast override so demo toasts are a bit wider */
    .toast { max-width: 380px; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="10" rx="2"/>
        <path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
        <line x1="12" y1="12" x2="12" y2="12.01"/>
      </svg>
    </div>
    <div class="sidebar-items">
      <a href="/" class="sidebar-item active" id="nav-dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="/battery" class="sidebar-item" id="nav-battery" title="Battery Packs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="18" height="10" rx="2"/>
          <path d="M20 11h2v2h-2"/>
          <line x1="7" y1="12" x2="11" y2="12"/>
          <line x1="9" y1="10" x2="9" y2="14"/>
        </svg>
        <span>Battery</span>
      </a>
      <a href="/settings" class="sidebar-item" id="nav-general" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </a>
      <a href="/network" class="sidebar-item" id="nav-network" title="Network">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12" y2="20"/>
        </svg>
        <span>Network</span>
      </a>
      <a href="/alerts" class="sidebar-item" id="nav-alerts" title="Alerts">
        <div style="position:relative;display:inline-flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="alert-badge" id="alert-badge" style="display:none"></span>
        </div>
        <span>Alerts</span>
      </a>
      <a href="/diag" class="sidebar-item" id="nav-diag" title="Diagnostics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Diag</span>
      </a>
    </div>
  </nav>

  <!-- Main area -->
  <div class="main">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-title">TopBand BMS Gateway</div>
      <div class="topbar-right">
        <span class="demo-badge" title="Interactive demo — no real device connected">DEMO</span>
        <span class="status-pill pill-wifi" id="status-wifi">WiFi</span>
        <span class="status-pill pill-bms" id="status-bms">BMS —</span>
        <span class="status-pill pill-can" id="status-can">CAN —</span>
        <span class="status-pill pill-mqtt off" id="status-mqtt">MQTT</span>
        <span class="topbar-time" id="topbar-time">--:--</span>
        <button class="logout-btn" id="logout-btn" title="Sign out" style="display:none">Sign out</button>
        <button class="theme-btn" id="theme-btn" title="Toggle theme">
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Auth-disabled banner -->
    <div class="auth-disabled-banner" id="auth-banner" style="display:none">
      <span>Auth disabled — set a new password to re-enable security.</span>
      <button class="auth-banner-close" onclick="dismissAuthBanner()" title="Dismiss">&#215;</button>
    </div>

    <!-- Page content (SPA routing) -->
    <main class="content" id="page-root">
      <!-- Injected by app.js -->
    </main>
  </div>

  <script src="./uplot.min.js"></script>
  <script src="./lib/sha256.min.js"></script>
  <!-- Demo mock backend — must load before app.js -->
  <script src="./mock.js"></script>
  <script src="./app.js"></script>
</body>
</html>
