<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopBand BMS Gateway</title>
  <!-- GitHub Pages serves this folder (main/docs) at the site root. Without an
       index the root URL 404s, so send visitors to the interactive demo. -->
  <meta http-equiv="refresh" content="0; url=./demo/">
  <link rel="canonical" href="./demo/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1419;
      color: #e6e8eb;
    }
    .card { text-align: center; padding: 32px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: #9aa0a6; margin: 0 0 20px; font-size: 14px; }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      background: #E89C5C;
      color: #0f1419;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
    }
    a.repo { display: block; margin-top: 16px; color: #7aa2f7; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TopBand BMS Gateway</h1>
    <p>Redirecting to the interactive demo...</p>
    <a class="btn" href="./demo/">Open the demo</a>
    <a class="repo" href="https://github.com/swingstate/topband-bms-gateway">View the project on GitHub</a>
  </div>
</body>
</html>
