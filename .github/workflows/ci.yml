name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git_sha_gen.py needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build esp32s3
        run: pio run -e esp32s3

  test:
    name: Host unit tests (CMake/ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache CMake FetchContent deps
        uses: actions/cache@v4
        with:
          path: build_host/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('test/host/CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build_host -S test/host

      - name: Build
        run: cmake --build build_host -j "$(nproc)"

      - name: Run ctest
        # --output-on-failure so a real regression is visible in the Actions log.
        # No `|| true` / continue-on-error: a build or run failure here must fail CI.
        run: |
          cd build_host
          ctest --output-on-failure

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Native smoke test (test/native/test_smoke)
        # Filtered to just the smoke suite: unfiltered `pio test -e native`
        # also tries to treat test/host/*.cpp (CMake/Catch2 sources, not
        # PlatformIO Unity suites) as native test suites and errors on all of
        # them — that's what CI was actually (mis)running before this fix.
        run: pio test -e native --filter "native/test_smoke"

  check:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and cppcheck
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run pio check
        run: pio check --fail-on-defect=high
