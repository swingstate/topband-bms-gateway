; TopBand BMS Gateway V3.0 — PlatformIO configuration
; Framework: ESP-IDF native (no Arduino). See docs/architecture.md §9.1.
;
; Common commands:
;   pio run                                    -> compile (esp32s3 env)
;   pio run -e esp32s3 -t upload               -> USB flash (device at /dev/cu.usbmodem*)
;   pio run -e esp32s3 -t upload \
;       --upload-port <gateway-ip>             -> OTA flash
;   pio device monitor                         -> serial console 115200 baud
;   cmake -B build_host -S test/host && \
;     cmake --build build_host && \
;     (cd build_host && ctest --output-on-failure) -> host-side Catch2 tests

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include
data_dir = data

; ── Production build, USB upload ──────────────────────────────────────────────
[env:esp32s3]
platform = espressif32@^6.7.0
framework = espidf
board = esp32-s3-devkitm-1

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
    -O2
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -DBOARD_WAVESHARE_S3
    -DBOARD_HAS_PSRAM
    -DFW_VERSION=\"3.0.0-dev\"
    -DSMOKE_READER_ENABLED=1

; Inject GIT_SHA into include/git_sha.h before every build.
extra_scripts = pre:tools/git_sha_gen.py

; ── Host-side unit tests (Catch2 via CMake, not PlatformIO) ───────────────────
; Run with:
;   cmake -B build_host -S test/host
;   cmake --build build_host
;   (cd build_host && ctest --output-on-failure)
;
; The [env:native] below keeps the existing test/native/test_smoke working.
[env:native]
platform = native
framework =
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNIT_TEST
    -DNATIVE_BUILD
